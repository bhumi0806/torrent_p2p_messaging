<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Bleep P2P Chat</title>

    <style>

        body {

            font-family: Arial, Helvetica, sans-serif;

            margin: 20px;

            background: #f5f5f5;

        }

        h2 {

            margin-bottom: 15px;

        }

        section {

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 15px;

            margin-bottom: 20px;

        }

        input,
        button,
        select {

            padding: 8px;

            margin: 5px;

            font-size: 14px;

        }

        button {

            cursor: pointer;

        }

        #userList {

            width: 250px;

            height: 150px;

        }

        #connectedPeers {

            list-style: none;

            padding: 10px;

            border: 1px solid #ccc;

            min-height: 80px;

            background: #fafafa;

        }

        #chatWindow {

            border: 1px solid #ccc;

            background: white;

            height: 300px;

            overflow-y: auto;

            padding: 10px;

            margin-top: 10px;

            margin-bottom: 10px;

        }

        #chatWindow div {

            margin-bottom: 8px;

        }

        #statusPanel span {

            display: inline-block;

            margin-right: 20px;

        }

        #log {

            background: #111;

            color: #00ff00;

            padding: 10px;

            height: 180px;

            overflow-y: auto;

        }

        progress {

            width: 250px;

        }

    </style>

</head>

<body>

<h2>Bleep P2P Chat</h2>

<!-- LOGIN -->

<section>

<h3>Login</h3>

<input

id="me"

type="text"

placeholder="Username">

<button id="loginBtn">

Login

</button>

<div id="loginErrorMessage" style="color: red; margin-top: 10px; display: none;"></div>

<div id="loginSuccessMessage" style="color: green; margin-top: 10px; display: none;"></div>

</section>

<!-- STATUS -->

<section id="statusPanel">

<h3>Status</h3>

<span>

Connection :

<strong id="status">

Offline

</strong>

</span>

<span>

Heartbeat :

<strong id="heartbeatStatus">

Stopped

</strong>

</span>

<span>

Reconnect :

<strong id="reconnectStatus">

Idle

</strong>

</span>

</section>

<!-- ONLINE USERS -->

<section>

<h3>Online Users</h3>

<select

id="userList"

size="8">

</select>

<br>

<button id="connectSelected">

Connect Selected

</button>

<button id="disconnectBtn">

Disconnect

</button>

</section>

<!-- CONNECTED PEERS -->

<section>

<h3>Connected Peers</h3>

<ul id="connectedPeers">

</ul>

</section>

<!-- CHAT -->

<section>

<h3>Chat</h3>

<div id="chatWindow">

</div>

<input

id="msg"

type="text"

placeholder="Type message...">

<button id="sendBtn">

Send

</button>

<div id="typingStatus">

</div>

</section>

<!-- FILE TRANSFER -->

<section>

<h3>File Transfer</h3>

<input

id="fileInput"

type="file">

<button id="sendFileBtn">

Send File

</button>

<br><br>

<progress

id="fileProgress"

value="0"

max="100">

</progress>

</section>

<!-- DEBUG -->

<section>

<h3>Application Log</h3>

<pre id="log"></pre>

</section>

<script type="importmap">

{

"imports": {

"libsodium-wrappers":

"https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.11/+esm"

}

}

</script>

<script src="./messageRouter.js"></script>

<script type="module" src="./app.js"></script>

</body>

</html>
