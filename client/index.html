<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bleep P2P Chat</title>

    <style>

        body {

            font-family: Arial, Helvetica, sans-serif;

            margin: 0;
            padding: 16px;

            background: #f5f5f5;

        }

        * {

            box-sizing: border-box;

        }

        h2 {

            margin-bottom: 15px;

        }

        section {

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 15px;

            margin-bottom: 20px;

        }

        input,
        button,
        select {

            padding: 8px;

            margin: 5px 0;

            font-size: 14px;

        }

        button {

            cursor: pointer;

        }

        #userList {

            width: 250px;
            max-width: 100%;

            height: 150px;

        }

        #connectedPeers {

            list-style: none;

            padding: 10px;

            border: 1px solid #ccc;

            min-height: 80px;

            background: #fafafa;

        }

        #chatWindow {

            border: 1px solid #ccc;

            background: white;

            height: 300px;

            overflow-y: auto;

            padding: 10px;

            margin-top: 10px;

            margin-bottom: 10px;

        }

        #chatWindow div {

            margin-bottom: 8px;

        }

        #statusPanel span {

            display: inline-block;

            margin-right: 20px;

        }

        #log {

            background: #111;

            color: #00ff00;

            padding: 10px;

            height: 180px;

            overflow-y: auto;

        }

        progress {

            width: 250px;
            max-width: 100%;

        }

        #msg {

            width: min(420px, 100%);

        }

        #fileInput {

            max-width: 100%;

        }

        .inviteGrid {

            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: start;

        }

        #inviteLink,
        #incomingInvite,
        #publicFingerprint {

            width: 100%;

        }

        #inviteQr {

            width: 220px;
            height: 220px;
            border: 1px solid #ccc;
            background: #fff;

        }

        #inviteStatus {

            margin-top: 8px;
            min-height: 20px;

        }

        @media (max-width: 640px) {

            body {

                padding: 10px;

            }

            section {

                padding: 12px;

            }

            input,
            button,
            select {

                width: 100%;
                min-height: 42px;

            }

            #userList {

                width: 100%;

            }

            #chatWindow {

                height: 240px;

            }

            .inviteGrid {

                grid-template-columns: 1fr;

            }

            #statusPanel span {

                display: block;
                margin: 8px 0;

            }

        }

    </style>

</head>

<body>

<h2>Bleep P2P Chat</h2>

<!-- LOGIN -->

<section>

<h3>Login</h3>

<input

id="me"

type="text"

placeholder="Username">

<button id="loginBtn">

Login

</button>

<div id="loginErrorMessage" style="color: red; margin-top: 10px; display: none;"></div>

<div id="loginSuccessMessage" style="color: green; margin-top: 10px; display: none;"></div>

</section>

<!-- STATUS -->

<section id="statusPanel">

<h3>Status</h3>

<span>

Connection :

<strong id="status">

Offline

</strong>

</span>

<span>

Heartbeat :

<strong id="heartbeatStatus">

Stopped

</strong>

</span>

<span>

Reconnect :

<strong id="reconnectStatus">

Idle

</strong>

</span>

</section>

<!-- INVITES -->

<section>

<h3>Invite & Fingerprint</h3>

<div class="inviteGrid">

<div>

<input

id="inviteLink"

type="text"

readonly

placeholder="Login to create invite link">

<button id="copyInviteBtn">

Copy Invite

</button>

<input

id="publicFingerprint"

type="text"

readonly

placeholder="Public-key fingerprint">

<input

id="incomingInvite"

type="text"

placeholder="Paste invite link">

<button id="verifyInviteBtn">

Verify Invite

</button>

<button id="connectInviteBtn">

Connect Invite

</button>

<div id="inviteStatus"></div>

</div>

<img

id="inviteQr"

alt="Invite QR code">

</div>

</section>

<!-- ONLINE USERS -->

<section>

<h3>Online Users</h3>

<select

id="userList"

size="8">

</select>

<br>

<button id="connectSelected">

Connect Selected

</button>

<button id="disconnectBtn">

Disconnect

</button>

</section>

<!-- CONNECTED PEERS -->

<section>

<h3>Connected Peers</h3>

<ul id="connectedPeers">

</ul>

</section>

<!-- CHAT -->

<section>

<h3>Chat</h3>

<div id="chatWindow">

</div>

<input

id="msg"

type="text"

placeholder="Type message...">

<button id="sendBtn">

Send

</button>

<div id="typingStatus">

</div>

</section>

<!-- FILE TRANSFER -->

<section>

<h3>File Transfer</h3>

<input

id="fileInput"

type="file">

<button id="sendFileBtn">

Send File

</button>

<br><br>

<progress

id="fileProgress"

value="0"

max="100">

</progress>

</section>

<!-- DEBUG -->

<section>

<h3>Application Log</h3>

<pre id="log"></pre>

</section>

<script type="importmap">

{

"imports": {

"libsodium-wrappers":

"https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.11/+esm"

}

}

</script>

<script src="./messageRouter.js"></script>

<script type="module" src="./app.ts"></script>

</body>

</html>
